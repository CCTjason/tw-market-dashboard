name: Daily Market Data Update

on:
  schedule:
    # UTC 08:35 = 台北時間 16:35 (週一至週五)
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Fetch Script
        run: python scripts/fetch_data.py

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update market data: $(date '+%Y-%m-%d %H:%M')" && git push)
