<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台股資金流儀表板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #08121e;
      --card-bg: #0c1b2e;
      --card-border: #1a3352;
      --green: #00ffa6;
      --red: #ff4a5a;
      --amber: #f59e0b;
      --text-gray: #8ba2bf;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 0%, #0d2542 0%, #08121e 80%);
      color: #fff;
      font-family: 'Noto Sans TC', sans-serif;
      padding: 20px;
      min-height: 100vh;
    }
    .container { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    
    /* Header */
    .header { display: flex; justify-content: space-between; align-items: center; }
    .title { font-size: 26px; font-weight: 900; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
    .badge-date {
      background: rgba(14, 165, 233, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 6px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      color: #38bdf8;
    }

    /* KPI Cards */
    .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 16px 20px;
    }
    .card-head { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #cbd5e1; font-weight: 600; }
    .kpi-main { display: flex; align-items: baseline; gap: 10px; margin: 12px 0 6px 0; }
    .kpi-tag {
      background: rgba(0, 255, 166, 0.15);
      border: 1px solid var(--green);
      color: var(--green);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 15px;
      font-weight: 700;
    }
    .kpi-num { font-size: 34px; font-weight: 900; }
    .num-green { color: var(--green); }
    .kpi-sub { font-size: 12px; color: var(--text-gray); }

    /* Chart Section */
    .chart-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 20px;
    }
    .chart-header { font-size: 18px; font-weight: 800; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

    /* Matrix Table Layout */
    .chart-table { width: 100%; border-collapse: collapse; }
    .chart-table th {
      color: #94a3b8;
      font-size: 13px;
      font-weight: 700;
      padding-bottom: 12px;
      text-align: center;
      border-bottom: 1px solid #1a3352;
    }
    .chart-table td { padding: 14px 6px; border-bottom: 1px solid rgba(26, 51, 82, 0.6); }

    .row-title { width: 140px; font-size: 14px; font-weight: 800; }
    .row-title span { display: block; font-size: 11px; color: var(--text-gray); font-weight: 400; margin-top: 2px; }

    /* Bar Visualizer */
    .bar-stage {
      height: 64px;
      position: relative;
      background: rgba(10, 22, 38, 0.6);
      border-radius: 6px;
      display: flex;
      justify-content: center;
      overflow: hidden;
    }
    .zero-line {
      position: absolute;
      left: 0; right: 0;
      height: 1px;
      background: rgba(255, 255, 255, 0.15);
      z-index: 1;
    }
    .bar-col {
      width: 24px;
      position: absolute;
      border-radius: 3px;
      transition: height 0.5s ease;
      z-index: 2;
    }
    .val-badge {
      position: absolute;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      z-index: 3;
    }

    /* Colors */
    .bar-green { background: #00cca3; }
    .bar-red { background: #e63946; }
    .bar-amber { background: #f59e0b; }

    /* Bottom Insight */
    .insight-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 16px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
    }
    .flow-steps { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 320px; }
    .step-box {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 700;
    }
    .step-box small { display: block; font-size: 11px; color: var(--text-gray); font-weight: 400; }
    .flow-arrow { color: #38bdf8; font-weight: 900; }
    .insight-narrative {
      flex: 1;
      min-width: 280px;
      font-size: 13px;
      color: #cbd5e1;
      border-left: 2px solid #0284c7;
      padding-left: 12px;
      line-height: 1.6;
    }
    .footer { text-align: center; font-size: 12px; color: #64748b; margin-top: 6px; }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .kpi-grid { grid-template-columns: 1fr; }
      .chart-card { overflow-x: auto; }
      .chart-table { min-width: 600px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">📊 台股資金流儀表板</div>
      <div class="badge-date" id="period-title">載入中...</div>
    </div>

    <div class="kpi-grid">
      <div class="card">
        <div class="card-head">🌐 外資現貨買賣超 (過去5日)</div>
        <div class="kpi-main">
          <span class="kpi-tag" id="kpi-foreign-tag">賣超</span>
          <span class="kpi-num num-green" id="kpi-foreign-val">--</span>
        </div>
        <div class="kpi-sub" id="kpi-foreign-sub">--</div>
      </div>
      <div class="card">
        <div class="card-head">📈 加權指數 (過去5日)</div>
        <div class="kpi-main">
          <span class="kpi-num num-green" id="kpi-taiex-pts">--</span>
        </div>
        <div class="kpi-sub" id="kpi-taiex-pct">--</div>
      </div>
      <div class="card">
        <div class="card-head">💵 新台幣兌美元 (過去5日)</div>
        <div class="kpi-main">
          <span class="kpi-num num-green" id="kpi-fx-cents">--</span>
        </div>
        <div class="kpi-sub" id="kpi-fx-pct">--</div>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-header">📊 每日資金流、股價與匯率 (滾動五日)</div>
      <table class="chart-table">
        <thead>
          <tr id="table-head-row">
            <th style="width: 140px; text-align: left;">指標項目</th>
            <!-- 5日日期標籤將由 JS 動態生成 -->
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- 3排長條柱狀圖將由 JS 動態生成 -->
        </tbody>
      </table>
    </div>

    <div class="insight-card">
      <div class="flow-steps">
        <div class="step-box">外資賣超<small>資金流出，壓抑台股</small></div>
        <div class="flow-arrow">➔</div>
        <div class="step-box">台股下跌<small>加權指數偏弱</small></div>
        <div class="flow-arrow">➔</div>
        <div class="step-box">新台幣貶值<small>匯率走弱承壓</small></div>
      </div>
      <div class="insight-narrative">
        <strong>三者聯動顯示：</strong><br>
        外資持續調節導致台股承壓，資金流出促使新台幣走弱偏貶。
      </div>
    </div>

    <div class="footer" id="update-time">【資料更新時間】: 載入中...</div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      fetch('./data.json?t=' + new Date().getTime())
        .then(res => res.json())
        .then(data => render(data))
        .catch(err => console.error("載入失敗:", err));
    });

    function render(data) {
      document.getElementById('period-title').innerText = data.period_title;
      document.getElementById('update-time').innerText = "【資料更新時間】: " + data.update_time;

      document.getElementById('kpi-foreign-tag').innerText = data.kpi.foreign_net.label;
      document.getElementById('kpi-foreign-val').innerText = data.kpi.foreign_net.value;
      document.getElementById('kpi-foreign-sub').innerText = data.kpi.foreign_net.subtext;

      document.getElementById('kpi-taiex-pts').innerText = data.kpi.taiex.points;
      document.getElementById('kpi-taiex-pct').innerText = data.kpi.taiex.pct;

      document.getElementById('kpi-fx-cents').innerText = data.kpi.fx.cents;
      document.getElementById('kpi-fx-pct').innerText = data.kpi.fx.pct;

      // 產生表格表頭 (日期)
      const headRow = document.getElementById('table-head-row');
      data.daily_data.forEach(d => {
        const th = document.createElement('th');
        th.innerText = `${d.date} (${d.weekday})`;
        headRow.appendChild(th);
      });

      const tbody = document.getElementById('table-body');

      // 1. 外資買賣超 (柱狀圖: 0軸在頂部或中間，賣超向下生長)
      let tr1 = `<tr><td class="row-title">外資買賣超<span>(億元)</span></td>`;
      data.daily_data.forEach(d => {
        const val = d.foreign_net;
        const isNeg = val < 0;
        // 換算長條高度 (最大約 3000 億對應 50px)
        const barH = Math.min(Math.max(Math.abs(val) / 3200 * 48, 6), 50);
        const colorCls = isNeg ? 'bar-green' : 'bar-red';
        const valText = (val > 0 ? '+' : '') + val;
        
        tr1 += `<td>
          <div class="bar-stage">
            <div class="zero-line" style="top: 8px;"></div>
            <div class="bar-col ${colorCls}" style="top: 8px; height: ${barH}px;"></div>
            <div class="val-badge" style="top: ${barH + 12}px; color: ${isNeg ? 'var(--green)' : 'var(--red)'};">${valText}</div>
          </div>
        </td>`;
      });
      tr1 += `</tr>`;

      // 2. 加權指數單日漲跌幅 (柱狀圖: 0軸在中間 32px，正值向上、負值向下)
      let tr2 = `<tr><td class="row-title">加權指數漲跌<span>(%)</span></td>`;
      data.daily_data.forEach(d => {
        const val = d.taiex_change_pct;
        const isPos = val >= 0;
        // 換算長條高度 (最大 3.5% 對應 26px)
        const barH = Math.min(Math.max(Math.abs(val) / 3.5 * 24, 4), 26);
        const colorCls = isPos ? 'bar-red' : 'bar-green';
        const valText = (val > 0 ? '+' : '') + val + '%';
        const topPos = isPos ? (32 - barH) : 32;
        const badgeTop = isPos ? (topPos - 16) : (32 + barH + 2);

        tr2 += `<td>
          <div class="bar-stage">
            <div class="zero-line" style="top: 32px;"></div>
            <div class="bar-col ${colorCls}" style="top: ${topPos}px; height: ${barH}px;"></div>
            <div class="val-badge" style="top: ${badgeTop}px; color: ${isPos ? 'var(--red)' : 'var(--green)'};">${valText}</div>
          </div>
        </td>`;
      });
      tr2 += `</tr>`;

      // 3. 新台幣匯市成交量 (柱狀圖: 0軸在底部，數值越大越高)
      let tr3 = `<tr><td class="row-title">新台幣匯市量<span>(億美元)</span></td>`;
      data.daily_data.forEach(d => {
        const val = d.total_fx_vol;
        // 換算長條高度 (最大 100 億美元對應 42px)
        const barH = Math.min(Math.max(val / 100 * 42, 6), 44);
        tr3 += `<td>
          <div class="bar-stage">
            <div class="val-badge" style="bottom: ${barH + 6}px; color: var(--amber);">${val}</div>
            <div class="bar-col bar-amber" style="bottom: 4px; height: ${barH}px;"></div>
          </div>
        </td>`;
      });
      tr3 += `</tr>`;

      tbody.innerHTML = tr1 + tr2 + tr3;
    }
  </script>
</body>
</html>
